<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九マスター - ポケモンカードを集めよう！</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: #fff;
            user-select: none;
            height: 100vh;
            overflow: hidden;
        }

        /* 3Dボタン風アニメーション */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        /* カードのホログラム・キラ演出 */
        .card-foil {
            position: relative;
            overflow: hidden;
        }
        .card-foil::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                115deg,
                transparent 25%,
                rgba(255, 255, 255, 0.6) 45%,
                rgba(255, 0, 128, 0.4) 50%,
                rgba(0, 255, 255, 0.4) 55%,
                transparent 75%
            );
            transform: rotate(25deg);
            pointer-events: none;
            opacity: 0.7;
            animation: foilShift 4s infinite linear;
        }

        @keyframes foilShift {
            0% { transform: translateY(-30%) rotate(25deg); }
            100% { transform: translateY(30%) rotate(25deg); }
        }

        .gold-glow {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.9), 0 0 5px rgba(255, 255, 255, 0.8), inset 0 0 12px rgba(251, 191, 36, 0.6);
        }

        .super-glow {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9), 0 0 10px rgba(56, 189, 248, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* 震えるアニメーション（間違い時） */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 脈動アニメーション */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }

        /* モンスターボールゲットアニメーション */
        @keyframes throwBall {
            0% { transform: translate(-100px, 100px) scale(0.5) rotate(0deg); opacity: 0; }
            50% { transform: translate(0, -30px) scale(1.2) rotate(360deg); opacity: 1; }
            100% { transform: translate(0, 0) scale(1) rotate(720deg); opacity: 1; }
        }
        .animate-throw-ball {
            animation: throwBall 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes ballWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-18deg); }
            75% { transform: rotate(18deg); }
        }
        .animate-ball-wiggle {
            animation: ballWiggle 0.5s ease-in-out 3;
        }

        /* 風で揺れる草むらのアニメーション */
        @keyframes grassSway {
            0%, 100% { transform: skewX(0deg); }
            50% { transform: skewX(-4deg); }
        }
        .animate-grass-sway {
            transform-origin: bottom center;
            animation: grassSway 2.5s ease-in-out infinite;
        }

        /* ミサイル飛翔アニメーション */
        @keyframes flyMissile {
            0% { transform: translate(0, 0) scale(0.6) rotate(15deg); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translate(180px, -10px) scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: translate(210px, 0px) scale(1.2) rotate(0deg); opacity: 0; }
        }
        .animate-fly-missile {
            animation: flyMissile 0.45s ease-in forwards;
        }

        /* 命中時フラッシュ */
        @keyframes hitFlash {
            0% { filter: brightness(1) drop-shadow(0 0 0px red); }
            30% { filter: brightness(2.5) drop-shadow(0 0 15px red); transform: translateX(8px) scale(1.1); }
            60% { filter: brightness(1.8) drop-shadow(0 0 8px red); }
            100% { filter: brightness(1) drop-shadow(0 0 0px red); }
        }
        .animate-hit-flash {
            animation: hitFlash 0.35s ease-out;
        }

        /* ドット絵キャラクターの小刻みなバトルアニメーション */
        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .animate-pixel-bounce {
            animation: pixelBounce 0.4s steps(2) infinite;
        }

        @keyframes pixelMonster {
            0%, 100% { transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-3px) scaleX(1.02); }
        }
        .animate-pixel-monster {
            animation: pixelMonster 0.5s steps(2) infinite;
        }

        /* ドット絵のくっきり描画指定 */
        .pixelated {
            image-rendering: pixelated;
        }

        /* 超豪華レインボーネオンボーダー（全クリア時） */
        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 25px #ef4444, inset 0 0 15px #ef4444; }
            20% { box-shadow: 0 0 25px #f59e0b, inset 0 0 15px #f59e0b; }
            40% { box-shadow: 0 0 25px #10b981, inset 0 0 15px #10b981; }
            60% { box-shadow: 0 0 25px #06b6d4, inset 0 0 15px #06b6d4; }
            80% { box-shadow: 0 0 25px #8b5cf6, inset 0 0 15px #8b5cf6; }
            100% { box-shadow: 0 0 25px #ec4899, inset 0 0 15px #ec4899; }
        }
        .animate-rainbow-glow {
            animation: rainbowGlow 2s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-100 overflow-hidden relative">

    <!-- お祝い用花火・紙吹雪 Canvas -->
    <canvas id="celebration-canvas" class="pointer-events-none fixed inset-0 z-50 hidden"></canvas>

    <!-- ヘッダーナビゲーション -->
    <header class="bg-slate-900/90 border-b border-indigo-500/30 px-4 py-2.5 shadow-md shrink-0">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="showStageSelect()">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-red-500 to-yellow-400 flex items-center justify-center font-black text-lg shadow-md border-2 border-white text-slate-900">
                    99
                </div>
                <h1 class="font-black text-lg sm:text-xl tracking-wider text-amber-300 drop-shadow">九九マスター</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="showAlbum()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1.5 px-3.5 rounded-full border border-indigo-300/40 flex items-center gap-1.5 shadow-md btn-3d text-xs sm:text-sm">
                    <i data-lucide="book-open" class="w-4 h-4 text-yellow-300"></i>
                    <span>カードずかん (<span id="card-count">0</span>/36)</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-3 flex flex-col justify-between overflow-hidden">

        <!-- 1. 段選択画面 -->
        <section id="stage-select-screen" class="flex flex-col justify-between h-full py-2 space-y-3">
            <div class="text-center space-y-1">
                <h2 class="text-xl sm:text-2xl font-extrabold text-white drop-shadow">「ワールド」と「段」をえらぼう！</h2>
                <p class="text-indigo-200 text-xs sm:text-sm">クリアするとポケモンカードをGETできるよ！</p>
            </div>

            <!-- ワールド切り替えタブ (上り・下り・ランダム) -->
            <div id="world-tabs" class="flex justify-center gap-2 max-w-lg mx-auto w-full bg-slate-900/80 p-1.5 rounded-2xl border border-indigo-500/30">
                <button onclick="switchWorld('asc')" id="tab-asc" class="flex-1 py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-amber-400 text-slate-900 border-2 border-white shadow flex items-center justify-center gap-1">
                    <span>① 上り (1→9)</span>
                </button>
                <button onclick="switchWorld('desc')" id="tab-desc" class="flex-1 py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-slate-800 text-slate-400 flex items-center justify-center gap-1">
                    <span>② 下り (9→1)</span>
                </button>
                <button onclick="switchWorld('rand')" id="tab-rand" class="flex-1 py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-slate-800 text-slate-400 flex items-center justify-center gap-1">
                    <span>③ ランダム</span>
                </button>
            </div>

            <!-- 通知用トーストメッセージ -->
            <div id="toast-message" class="hidden transition-all duration-300 transform -translate-y-2 opacity-0 bg-slate-900/95 border-2 border-amber-400 text-amber-200 text-xs sm:text-sm font-black px-4 py-2 rounded-full shadow-2xl text-center max-w-sm mx-auto">
                メッセージ
            </div>

            <div id="stages-grid" class="grid grid-cols-3 gap-3 max-w-xl mx-auto w-full my-auto">
                <!-- JavaScriptで段ボタンが動的に挿入されます -->
            </div>

            <div class="text-center text-slate-400 text-[11px]">
                💡 クリアすると次の段がオープン！残りライフが多いほどレアなカードがもらえるよ！
            </div>
        </section>

        <!-- 2. ゲーム画面 -->
        <section id="game-screen" class="hidden flex flex-col justify-between h-full max-w-md mx-auto w-full py-1">
            <!-- 進行度・ヘッダー情報 -->
            <div class="w-full bg-slate-900/80 p-2.5 rounded-2xl border border-indigo-500/30 flex justify-between items-center shadow-lg shrink-0">
                <div class="flex items-center gap-2">
                    <span id="current-stage-title" class="text-lg sm:text-xl font-black text-amber-300">1の段</span>
                    <span id="current-round-tag" class="text-[11px] bg-indigo-500/40 text-indigo-200 px-2 py-0.5 rounded-full border border-indigo-400/30">上りワールド</span>
                </div>
                <!-- ライフ表示 -->
                <div class="flex items-center space-x-1" id="hearts-container">
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                </div>
            </div>

            <!-- ドット絵バトルエリア（青空と風に揺れる草むら背景） -->
            <div class="w-full border-2 border-emerald-400/60 rounded-2xl p-2 flex items-center justify-between shrink-0 my-1 relative overflow-hidden h-36 shadow-2xl bg-gradient-to-b from-sky-400 via-sky-200 to-emerald-300">
                
                <!-- 雲アニメーション（背景遠景） -->
                <div class="absolute top-2 left-6 w-12 h-4 bg-white/70 rounded-full blur-[0.5px]"></div>
                <div class="absolute top-4 right-12 w-16 h-5 bg-white/60 rounded-full blur-[0.5px]"></div>

                <!-- 風で揺れる草むらレイヤー（下部） -->
                <div class="absolute bottom-0 inset-x-0 h-10 bg-emerald-500 border-t-2 border-emerald-400 flex items-end justify-around animate-grass-sway overflow-hidden pointer-events-none">
                    <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-b-[18px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-b-[24px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[20px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-b-[26px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[9px] border-l-transparent border-r-[9px] border-r-transparent border-b-[19px] border-b-emerald-600"></div>
                </div>

                <!-- 左：ポケモンマスター -->
                <div class="relative z-10 flex items-center justify-center pl-2">
                    <div class="w-16 h-16 animate-pixel-bounce flex items-center justify-center filter drop-shadow-md">
                        <svg class="w-16 h-16 pixelated" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- 帽子 -->
                            <rect x="8" y="2" width="16" height="4" fill="#ef4444"/>
                            <rect x="6" y="6" width="20" height="2" fill="#ef4444"/>
                            <rect x="18" y="6" width="8" height="2" fill="#ffffff"/>
                            <rect x="6" y="8" width="21" height="2" fill="#b91c1c"/>
                            <!-- 髪・顔 -->
                            <rect x="8" y="10" width="14" height="6" fill="#fde047"/>
                            <rect x="10" y="10" width="12" height="6" fill="#fed7aa"/>
                            <!-- 目・眉 -->
                            <rect x="18" y="11" width="3" height="1" fill="#1e293b"/>
                            <rect x="18" y="12" width="2" height="2" fill="#1e293b"/>
                            <rect x="19" y="12" width="1" height="1" fill="#ffffff"/>
                            <!-- 服 -->
                            <rect x="8" y="16" width="16" height="10" fill="#2563eb"/>
                            <rect x="12" y="16" width="8" height="8" fill="#ffffff"/>
                            <rect x="14" y="16" width="4" height="8" fill="#e0f2fe"/>
                            <!-- 腕・手 -->
                            <rect x="4" y="17" width="4" height="6" fill="#1d4ed8"/>
                            <rect x="24" y="17" width="4" height="6" fill="#fed7aa"/>
                            <!-- ズボン・靴 -->
                            <rect x="10" y="26" width="4" height="5" fill="#1e293b"/>
                            <rect x="18" y="26" width="4" height="5" fill="#1e293b"/>
                            <rect x="8" y="29" width="6" height="2" fill="#ef4444"/>
                            <rect x="18" y="29" width="6" height="2" fill="#ef4444"/>
                        </svg>
                    </div>

                    <!-- 飛んでいくミサイル -->
                    <div id="missile-anim" class="hidden absolute left-12 top-4 z-30 pointer-events-none">
                        <svg class="w-8 h-8 pixelated drop-shadow-lg" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="6" width="10" height="4" fill="#f97316"/>
                            <rect x="12" y="7" width="3" height="2" fill="#ef4444"/>
                            <rect x="0" y="5" width="3" height="2" fill="#ea580c"/>
                            <rect x="0" y="9" width="3" height="2" fill="#ea580c"/>
                            <rect x="4" y="7" width="2" height="2" fill="#fef08a"/>
                        </svg>
                    </div>
                </div>

                <!-- 右：野生のドット絵怪獣 -->
                <div id="wild-pokemon-container" class="relative z-10 flex flex-col items-center justify-center w-36 h-32 pr-2 overflow-visible">
                    <div id="target-pokemon-scale-box" class="transition-transform duration-500 origin-center flex flex-col items-center scale-[2.2]">
                        <div class="animate-pixel-monster flex flex-col items-center">
                            <div id="pixel-monster-svg-box" class="w-16 h-16 filter drop-shadow-xl flex items-center justify-center">
                                <!-- JSで生成される高精度ドット絵が入ります -->
                            </div>
                        </div>
                    </div>

                    <!-- 命中ヒット爆発エフェクト -->
                    <div id="hit-explosion" class="hidden absolute z-30 pointer-events-none">
                        <div class="text-3xl animate-ping">💥</div>
                    </div>

                    <!-- アニメーション用モンスターボール -->
                    <div id="monster-ball-anim" class="hidden absolute z-20 flex flex-col items-center">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-b from-red-600 via-white to-white border-2 border-slate-900 shadow-2xl relative flex items-center justify-center overflow-hidden">
                            <div class="absolute inset-x-0 top-1/2 h-1 bg-slate-900 -translate-y-1/2"></div>
                            <div class="w-3.5 h-3.5 rounded-full bg-white border-2 border-slate-900 z-10 shadow"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 問題表示 -->
            <div class="w-full shrink-0 my-2">
                <div class="w-full h-32 sm:h-36 rounded-2xl bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 border-4 border-white shadow-xl flex flex-col items-center justify-center p-2 text-slate-900 animate-pulse-subtle">
                    <div class="text-[10px] font-black uppercase tracking-widest text-amber-900/80">こうしき</div>
                    <div id="question-text" class="text-4xl sm:text-5xl font-black tracking-wider text-slate-900 my-1">
                        1 × 1
                    </div>
                    <div id="yomi-text" class="text-xs sm:text-sm font-bold text-amber-900 bg-amber-100/90 px-3 py-0.5 rounded-full border border-amber-300">
                        いちいちが
                    </div>
                </div>
            </div>

            <!-- 選択肢 4択 -->
            <div class="w-full shrink-0 my-2">
                <div id="options-grid" class="flex justify-center items-center gap-2 sm:gap-4 w-full">
                    <!-- 動的に生成されます -->
                </div>
            </div>

            <div class="text-center text-indigo-300/70 text-[11px] shrink-0">
                せいかいの 丸いカードを選んでね！
            </div>
        </section>

        <!-- 3. クリア演出画面 -->
        <section id="clear-screen" class="hidden flex flex-col justify-center items-center h-full max-w-md mx-auto w-full py-2 relative z-40">
            <div id="clear-modal-box" class="bg-slate-900/95 border-2 border-amber-400/60 rounded-3xl p-5 shadow-2xl w-full text-center space-y-4 relative overflow-hidden">
                <div class="space-y-1">
                    <div id="clear-badge" class="inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-slate-900 shadow">
                        GOLD CLEAR!
                    </div>
                    <h2 id="clear-title" class="text-2xl font-black text-amber-300 drop-shadow">1の段 クリア！</h2>
                    <p id="clear-subtitle" class="text-indigo-200 text-xs sm:text-sm">ポケモンカードを ゲットしたよ！</p>
                    
                    <!-- ワールドクリア・全クリア特別バナー -->
                    <div id="world-clear-banner" class="hidden my-2 py-2 px-3 bg-gradient-to-r from-amber-400 via-rose-500 to-purple-600 text-white font-black text-sm rounded-xl shadow-lg border-2 border-white animate-bounce">
                        🎉 上りワールド 完全クリア！ 🎉
                    </div>
                </div>

                <!-- 獲得カードプレビュー -->
                <div class="flex justify-center py-1">
                    <div id="reward-card-container" class="transform hover:scale-105 transition-transform duration-300 cursor-pointer">
                        <!-- カードDOM -->
                    </div>
                </div>

                <div class="space-y-2 pt-1">
                    <button id="next-btn" onclick="handleNextStep()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-lg font-black rounded-xl shadow-lg btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <span>つぎへ すすむ</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                    <button onclick="startStage(currentStageNumber)" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white font-black text-base rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        <span>もう１かいする</span>
                    </button>
                    <button onclick="showStageSelect()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2 text-sm">
                        <i data-lucide="home" class="w-4 h-4"></i>
                        <span>メニューに戻る</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 4. アルバム（カード図鑑）画面 -->
        <section id="album-screen" class="hidden flex flex-col h-full space-y-3">
            <div class="flex justify-between items-center border-b border-indigo-500/30 pb-2 shrink-0">
                <div>
                    <h2 class="text-lg sm:text-xl font-black text-amber-300 flex items-center gap-1.5">
                        <i data-lucide="award" class="w-6 h-6 text-yellow-400"></i> ポケモンカードずかん
                    </h2>
                    <p class="text-indigo-200 text-xs">ゲットしたカードをタップして大きくみられるよ！</p>
                </div>
                <button onclick="showStageSelect()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs btn-3d">
                    もどる
                </button>
            </div>

            <!-- カードグリッド -->
            <div id="album-grid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 p-1">
                <!-- 動的に生成 -->
            </div>
        </section>

        <!-- 5. カード拡大モーダル -->
        <div id="card-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4" onclick="closeCardModal()">
            <div class="relative transform scale-125 sm:scale-150 transition-transform duration-300" onclick="event.stopPropagation()">
                <div id="modal-card-container"></div>
            </div>
            <button onclick="closeCardModal()" class="mt-12 bg-white/20 hover:bg-white/30 text-white font-black px-6 py-2 rounded-full border border-white/40 text-sm shadow-xl backdrop-blur-md">
                とじる
            </button>
        </div>

        <!-- ゲームオーバーモーダル -->
        <div id="gameover-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">

                    if (parsed.unlockedStages) gameState.unlockedStages = parsed.unlockedStages;

        // --- サウンド＆音声読み上げ（Web Audio API & SpeechSynthesis） ---
        let audioCtx = null;
        let bgmInterval = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        document.addEventListener('pointerdown', () => { getAudioContext(); }, { once: false });

        function playPinpon() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046.50, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.3);

            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1567.98, now + 0.15);
            gain2.gain.setValueAtTime(0.3, now + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.15);
            osc2.stop(now + 0.5);
        }

        function playBuzzer() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(120, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playFanfare(isAllClear = false) {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const notes = isAllClear 
                ? [523.25, 659.25, 783.99, 1046.50, 880.00, 1046.50, 1174.66, 1318.51]
                : [523.25, 659.25, 783.99, 1046.50];

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + idx * 0.12;
                const duration = idx === notes.length - 1 ? 0.8 : 0.15;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.3, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        function startBGM() {
            stopBGM();
            const ctx = getAudioContext();
            if (!ctx) return;

            const bassNotes = [110, 110, 146.83, 110, 130.81, 110, 123.47, 98];
            const leadNotes = [440, 523.25, 659.25, 587.33, 523.25, 440, 493.88, 523.25];
            let noteIdx = 0;

            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const now = audioCtx.currentTime;

                const bassOsc = audioCtx.createOscillator();
                const bassGain = audioCtx.createGain();
                bassOsc.type = 'sawtooth';
                bassOsc.frequency.setValueAtTime(bassNotes[noteIdx % bassNotes.length], now);
                bassGain.gain.setValueAtTime(0.08, now);
                bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                bassOsc.connect(bassGain);
                bassGain.connect(audioCtx.destination);
                bassOsc.start(now);
                bassOsc.stop(now + 0.12);

                const leadOsc = audioCtx.createOscillator();
                const leadGain = audioCtx.createGain();
                leadOsc.type = 'square';
                leadOsc.frequency.setValueAtTime(leadNotes[noteIdx % leadNotes.length], now);
                leadGain.gain.setValueAtTime(0.05, now);
                leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                leadOsc.connect(leadGain);
                leadGain.connect(audioCtx.destination);
                leadOsc.start(now);
                leadOsc.stop(now + 0.14);

                noteIdx++;
            }, 150);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function speakKukuQuestion(num1, num2) {

            const uttr = new SpeechSynthesisUtterance(speakText);
            uttr.lang = 'ja-JP';

        // 九九の正答に近い数字（同じ段の前後、計算ミスしやすい数など）でスマートに4択を作成
        function generateSmartOptions(q) {
            const num1 = q.num1;
            const num2 = q.num2;
            const answer = q.answer;

            const candidates = new Set();

            // 1. 同じ段の前後（九九の前後の答え： num1 * (num2 ± 1), num1 * (num2 ± 2)）
            [num2 - 1, num2 + 1, num2 - 2, num2 + 2].forEach(n2 => {
                if (n2 >= 1) {
                    const val = num1 * n2;
                    if (val > 0 && val !== answer) candidates.add(val);
                }
            });

            // 2. 隣の段の同じかける数 ((num1 ± 1) * num2)
            [num1 - 1, num1 + 1].forEach(n1 => {
                if (n1 >= 1 && n1 <= 9) {
                    const val = n1 * num2;
                    if (val > 0 && val !== answer) candidates.add(val);
                }
            });

            // 3. 正答に近い数 (answer ± 1, answer ± 2, answer ± 10)
            [answer - 1, answer + 1, answer - 2, answer + 2, answer - 10, answer + 10].forEach(val => {
                if (val > 0 && val <= 81 && val !== answer) candidates.add(val);
            });

            // 4. 全九九の積の中で正答と差が小さいもの
            const allProducts = [];
            for (let i = 1; i <= 9; i++) {
                for (let j = 1; j <= 9; j++) {
                    allProducts.push(i * j);
                }
            }
            allProducts.sort((a, b) => Math.abs(a - answer) - Math.abs(b - answer));
            allProducts.forEach(val => {
                if (val !== answer) candidates.add(val);
            });

            // 正解との差が小さい順にソート
            const sortedCandidates = Array.from(candidates).sort((a, b) => Math.abs(a - answer) - Math.abs(b - answer));

            // 正解と極めて近い上位7つの候補からランダムに3つ抽出
            const topPool = sortedCandidates.slice(0, Math.min(7, sortedCandidates.length));
            topPool.sort(() => Math.random() - 0.5);

            const wrongOptions = topPool.slice(0, 3);
            const result = [answer, ...wrongOptions];

            // 4つの選択肢をシャッフル
            return result.sort(() => Math.random() - 0.5);
        }

        function handleStageClear() {
            stopBGM();

            const world = gameState.currentWorld;
            const stage = gameState.currentStage;

            let rank = 'bronze';
            if (gameState.lives === 3) rank = 'gold';
            else if (gameState.lives === 2) rank = 'silver';

            const currentRank = gameState.clearedRanks[world][stage];
            const rankWeight = { gold: 3, silver: 2, bronze: 1 };
            if (!currentRank || rankWeight[rank] > (rankWeight[currentRank] || 0)) {
                gameState.clearedRanks[world][stage] = rank;
            }

            const currentIndex = STAGE_ORDER.indexOf(stage);
            if (currentIndex >= 0 && currentIndex < STAGE_ORDER.length - 1) {
                const nextStageNum = STAGE_ORDER[currentIndex + 1];
                if (!gameState.unlockedStages[world].includes(nextStageNum)) {
                    gameState.unlockedStages[world].push(nextStageNum);
                }
            }

            const isWorldComplete = STAGE_ORDER.every(st => gameState.clearedRanks[world][st]);
            const isAllWorldComplete = ['asc', 'desc', 'rand'].every(w => STAGE_ORDER.every(st => gameState.clearedRanks[w][st]));

            // 段・成績(ランク)・ワールドに応じた確率計算でカードを選出
            const newCard = getRandomPokemonCard(rank, stage, world);
            if (newCard && !gameState.ownedCards.includes(newCard.id)) {
                gameState.ownedCards.push(newCard.id);
                if (!gameState.newCards.includes(newCard.id)) {
                    gameState.newCards.push(newCard.id);
                }
            }

            saveData();

            const clearBadge = document.getElementById('clear-badge');
            if (rank === 'gold') {
                clearBadge.innerText = '🥇 PERFECT GOLD!';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-slate-900 shadow gold-glow';
            } else if (rank === 'silver') {
                clearBadge.innerText = '🥈 SILVER CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-slate-300 text-slate-900 shadow';
            } else {
                clearBadge.innerText = '🥉 BRONZE CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-700 text-white shadow';
            }

            document.getElementById('clear-title').innerText = `${stage}の段 クリア！`;

            const banner = document.getElementById('world-clear-banner');
            if (isAllWorldComplete) {
                banner.innerText = '🏆 でんせつの九九マスター達成！！ 🏆';
                banner.classList.remove('hidden');
                launchCelebration(true);
                playFanfare(true);
            } else if (isWorldComplete) {
                const wNames = { asc: '① 上りワールド', desc: '② 下りワールド', rand: '③ ランダムワールド' };
                banner.innerText = `🎉 ${wNames[world]} 完全クリア！ 🎉`;
                banner.classList.remove('hidden');
                launchCelebration(false);
                playFanfare(false);
            } else {
                banner.classList.add('hidden');
                playFanfare(false);
            }

            const cardBox = document.getElementById('reward-card-container');
            if (cardBox && newCard) {
                cardBox.innerHTML = createCardHtml(newCard);
            }

            hideAllScreens();
            document.getElementById('clear-screen').classList.remove('hidden');
        }

        function getRandomPokemonCard(rank, stageNum, world) {
            // ステージの進行度 (0: 1の段, 1: 5の段, 2: 2の段 ... 8: 9の段)
            const stageIndex = STAGE_ORDER.indexOf(stageNum);

            // レア度別の基本確率ウェイト（初期は★1中心）
            let weights = {
                '★1': 100,
                '★2': 10,
                '★3': 0,
                'SUPER': 0
            };

            // 1. 段の進捗によるレア度解放＆確率上昇
            if (stageIndex >= 2) { // 3番目の段以降
                weights['★2'] += 25;
                weights['★3'] += 5;
            }
            if (stageIndex >= 5) { // 中盤（6番目の段以降）
                weights['★1'] = 50;
                weights['★2'] += 40;
                weights['★3'] += 20;
                weights['SUPER'] += 5;
            }
            if (stageIndex >= 7) { // 終盤（8〜9番目の段）
                weights['★1'] = 20;
                weights['★2'] += 40;
                weights['★3'] += 35;
                weights['SUPER'] += 15;
            }

            // 2. クリア成績（ランク）による補正
            if (rank === 'gold') { // パーフェクト全問正解 (0ミス)
                weights['★1'] = Math.max(5, weights['★1'] - 60);
                weights['★2'] += 60;
                weights['★3'] += 30;
                // 序盤のゴールドは★2〜★3中心、後半の段のゴールドならSUPERも狙える！
                weights['SUPER'] += (stageIndex >= 4) ? 25 : 3;
            } else if (rank === 'silver') { // 1ミス
                weights['★1'] = Math.max(20, weights['★1'] - 20);
                weights['★2'] += 30;
                weights['★3'] += 10;
            } // bronze (2ミス) は補正なし（★1中心）

            // 3. ワールド難易度ボーナス
            if (world === 'desc') { // 下りワールド
                weights['★2'] += 15;
                weights['★3'] += 10;
                weights['SUPER'] += 5;
            } else if (world === 'rand') { // ランダムワールド
                weights['★2'] += 20;
                weights['★3'] += 15;
                weights['SUPER'] += 10;
            }

            // 重みの合計から確率判定（ウェイト抽選）
            const totalWeight = Object.values(weights).reduce((a, b) => a + Math.max(0, b), 0);
            let randVal = Math.random() * totalWeight;

            let selectedRarity = '★1';
            for (const [rarity, w] of Object.entries(weights)) {
                const weight = Math.max(0, w);
                if (randVal < weight) {
                    selectedRarity = rarity;
                    break;
                }
                randVal -= weight;
            }

            // 選ばれたレア度のカードリストを取得
            let rarityPool = POKEMON_CARDS.filter(c => c.rarity === selectedRarity);
            if (rarityPool.length === 0) {
                rarityPool = POKEMON_CARDS.filter(c => c.rarity === '★1');
            }

            // まだ持っていないカードがあれば優先的に抽選（図鑑集めの楽しみUP）
            const unownedPool = rarityPool.filter(c => !gameState.ownedCards.includes(c.id));
            const finalPool = unownedPool.length > 0 ? unownedPool : rarityPool;

            const idx = Math.floor(Math.random() * finalPool.length);
            return finalPool[idx] || POKEMON_CARDS[0];
        }

            if (!grid) return;
            grid.innerHTML = '';

            POKEMON_CARDS.forEach(card => {
                const isOwned = gameState.ownedCards.includes(card.id);
                const cardWrapper = document.createElement('div');
                cardWrapper.className = "flex justify-center items-center cursor-pointer transform hover:scale-105 transition-transform duration-200";

                if (isOwned) {
                    cardWrapper.innerHTML = createCardHtml(card);
                    cardWrapper.onclick = () => showCardModal(card.id);
                } else {
                    cardWrapper.innerHTML = `
                        <div class="w-full h-44 rounded-2xl bg-slate-900/80 border-2 border-slate-700/60 flex flex-col items-center justify-center p-3 text-slate-500 space-y-2 shadow-inner">

                        </div>
                    `;
                }

            });

        }

        function showCardModal(cardId) {
            const card = POKEMON_CARDS.find(c => c.id === cardId);
            if (!card) return;

            if (gameState.newCards.includes(cardId)) {
                gameState.newCards = gameState.newCards.filter(id => id !== cardId);
                saveData();
            }

            const modalBox = document.getElementById('modal-card-container');
            if (modalBox) {
                modalBox.innerHTML = createCardHtml(card, true);
            }
            document.getElementById('card-modal').classList.remove('hidden');
        }

        function closeCardModal() {
            document.getElementById('card-modal').classList.add('hidden');
            showAlbum();
        }

        function launchCelebration(isAllClear = false) {
            const canvas = document.getElementById('celebration-canvas');
            if (!canvas) return;
            canvas.classList.remove('hidden');

            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = isAllClear ? 220 : 90;

            const colors = ['#ef4444', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#ec4899', '#fde047', '#ffffff'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 5 + 3,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10
                });
            }

            let animationFrame = null;
            let startTime = Date.now();

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rotation += p.vRot;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();

                    if (p.y > canvas.height) {
                        p.y = -20;
                        p.x = Math.random() * canvas.width;
                    }
                });

                if (Date.now() - startTime < 6000) {
                    animationFrame = requestAnimationFrame(animate);
                } else {
                    canvas.classList.add('hidden');
                    cancelAnimationFrame(animationFrame);
                }
            }

            animate();
        }

        window.onload = function() {
            loadSaveData();
            showStageSelect();
        };
